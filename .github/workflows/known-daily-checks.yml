name: KNOWN Daily checks
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check app.js
          node --check config.js
          node --check api/bible.mjs
          node --check sw.js
      - name: Smoke and security contracts
        run: node --test tests/smoke.test.mjs
